[pytest]
testpaths = Tests
addopts = -ra -q
markers =
    funcao: o item faz o que promete (caminho feliz e bordas)
    estabilidade: entradas hostis/malformadas e falhas externas não derrubam
    integracao: peças trabalhando juntas
    interferencia: concorrência e isolamento entre execuções
    desempenho: limites de tempo/memória
    recursividade: profundidade, ciclos e laços
